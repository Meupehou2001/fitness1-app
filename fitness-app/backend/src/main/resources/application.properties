# ============================================================
# MySQL-Verbindung
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/fitness_app?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=change_me
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# "update" praktisch für die Entwicklung, in Produktion "validate" setzen (schema.sql ist maßgeblich)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=8080

# CORS wird in WebConfig.java konfiguriert (für den React-Client)
